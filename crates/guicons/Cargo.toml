[package]
name = "guicons"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Manifest-driven icon system for native Rust GUI applications"

[features]
default = ["macros"]
macros = ["dep:guicons-macros"]
slint = ["dep:slint", "dep:image", "guicons-macros?/slint"]
iced = ["dep:iced", "guicons-macros?/iced"]
windows-reactor = ["dep:windows-reactor", "guicons-macros?/windows-reactor"]

[dependencies]
guicons-macros = { path = "../guicons-macros", version = "0.3.2", optional = true }
slint = { version = "1.15.1", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
iced = { version = "0.14", optional = true, features = ["svg", "image"] }
# A plain crates-io-style requirement, not a direct git dependency:
# windows-reactor isn't published there (crates.io only has a reserved
# placeholder at 0.0.0), so this is never actually resolved against the
# registry - both this repo's own build/CI and any downstream crates-io
# install of guicons need their own
# `[patch.crates-io] windows-reactor = { git = "...", rev = "..." }`
# pointing at the fork (see this workspace's own root Cargo.toml). The
# wildcard `*` (not a pinned "0.0.0") is deliberate: Cargo's `[patch]`
# swap only applies when the patch's version is semver-compatible with
# the declared requirement, and 0.0.x buckets are each their own
# incompatible "major" under SemVer's zero-major rule - a pinned "0.0.0"
# would match crates.io's placeholder but silently fail to be patched
# to the fork's real (and independently drifting) version.
windows-reactor = { version = "*", optional = true }

[[example]]
name = "slint_icon"
required-features = ["slint"]

[[example]]
name = "iced_icon"
required-features = ["iced"]
