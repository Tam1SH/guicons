[package]
name = "guicons"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Manifest-driven icon system for native Rust GUI applications"

[features]
default = ["macros"]
macros = ["dep:guicons-macros"]
slint = ["dep:slint", "dep:image", "guicons-macros?/slint"]
iced = ["dep:iced", "guicons-macros?/iced"]
windows-reactor = ["dep:windows-reactor", "guicons-macros?/windows-reactor"]

[dependencies]
guicons-macros = { path = "../guicons-macros", version = "0.3.1", optional = true }
slint = { version = "1.15.1", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
iced = { version = "0.14", optional = true, features = ["svg", "image"] }
# `version` is required for `cargo publish` (crates.io rejects any
# dependency, git ones included, without one) - it's dropped from the
# published package regardless, replaced with this version number
# resolved against crates.io itself. Since windows-reactor isn't
# published there, anyone who enables this feature from a crates.io
# install of guicons (not this repo) needs their own
# `[patch.crates-io] windows-reactor = { git = "...", rev = "..." }`
# pointing at the fork - this repo's own build resolves the git dep
# directly and never touches crates.io for it.
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "a27687681", version = "0.0.0", optional = true }

[[example]]
name = "slint_icon"
required-features = ["slint"]

[[example]]
name = "iced_icon"
required-features = ["iced"]
