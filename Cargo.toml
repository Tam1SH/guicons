[workspace]
members = ["crates/guicons", "crates/guicons-build", "crates/guicons-cli", "crates/guicons-core", "crates/guicons-ffi", "crates/guicons-lsp", "crates/guicons-macros", "crates/guicons-net"]
resolver = "3"

[workspace.package]
version = "0.3.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tam1SH/guicons"

# Local/CI-only: windows-reactor isn't on crates.io (see crates/guicons/Cargo.toml's
# dependency comment) - this repo's own `--features windows-reactor` builds need the
# real fork source, not the "0.0.0" placeholder that satisfies `cargo publish`.
[patch.crates-io]
windows-reactor = { git = "https://github.com/Tam1SH/windows-rs", rev = "fba3ccc1c" }
